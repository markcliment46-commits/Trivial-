<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RascaGana Kids</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", Arial;
  background: linear-gradient(135deg, #ffcc70, #ff6f91);
  text-align: center;
  color: #333;
}

.container {
  padding: 20px;
}

h1 {
  color: white;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin: 20px auto;
  max-width: 400px;
}

button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #4caf50;
  color: white;
  font-size: 16px;
}

button:hover {
  background: #45a049;
}

#lives {
  font-size: 24px;
}

#timer {
  font-size: 18px;
  margin: 10px;
}

#progress {
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
}

#bar {
  height: 10px;
  width: 100%;
  background: red;
}

#scratchCanvas {
  background: gold;
  border-radius: 10px;
}

.hidden {
  display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>🎉 RascaGana Kids 🎉</h1>

<div id="hud">
  <div id="lives"></div>
  <div id="score">Puntos: 0/50</div>
  <div id="timer">Tiempo: 45</div>
  <div id="progress"><div id="bar"></div></div>
</div>

<div id="questionCard" class="card">
  <h3 id="question"></h3>
  <div id="answers"></div>
</div>

<div id="scratchCard" class="card hidden">
  <canvas id="scratchCanvas" width="300" height="150"></canvas>
  <p id="scratchResult"></p>
</div>

<div id="gameOver" class="card hidden">
  <h2>💀 Game Over</h2>
  <p id="finalScore"></p>
  <button onclick="resetGame()">Jugar de nuevo</button>
</div>

</div>

<script>
// =======================
// ESTADO
// =======================
let lives = parseInt(localStorage.getItem("lives")) || 3;
let points = parseInt(localStorage.getItem("points")) || 0;
let collection = JSON.parse(localStorage.getItem("collection")) || [];

let timer;
let timeLeft = 45;

// =======================
// UI
// =======================
function updateHUD() {
  document.getElementById("lives").innerHTML = "❤️".repeat(lives);
  document.getElementById("score").innerText = `Puntos: ${points}/50`;
}

// =======================
// TEMPORIZADOR
// =======================
function startTimer() {
  timeLeft = 45;
  document.getElementById("timer").innerText = "Tiempo: " + timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerText = "Tiempo: " + timeLeft;
    document.getElementById("bar").style.width = (timeLeft / 45 * 100) + "%";

    if (timeLeft <= 0) {
      clearInterval(timer);
      loseLife();
      loadQuestion();
    }
  }, 1000);
}

// =======================
// API TRIVIA
// =======================
async function loadQuestion() {
  document.getElementById("scratchCard").classList.add("hidden");
  document.getElementById("questionCard").classList.remove("hidden");

  clearInterval(timer);

  try {
    let res = await fetch("https://opentdb.com/api.php?amount=1&type=multiple&difficulty=easy");
    let data = await res.json();
    let q = data.results[0];

    let answers = [...q.incorrect_answers];
    answers.push(q.correct_answer);
    answers.sort(() => Math.random() - 0.5);

    document.getElementById("question").innerHTML = q.question;

    let answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    answers.slice(0,3).forEach(ans => {
      let btn = document.createElement("button");
      btn.innerHTML = ans;

      btn.onclick = () => {
        clearInterval(timer);
        if (ans === q.correct_answer) {
          showScratch();
        } else {
          loseLife();
          loadQuestion();
        }
      };

      answersDiv.appendChild(btn);
    });

    startTimer();

  } catch {
    document.getElementById("question").innerText = "Error cargando pregunta";
  }
}

// =======================
// VIDAS
// =======================
function loseLife() {
  lives--;
  saveState();
  updateHUD();

  if (lives <= 0) {
    showGameOver();
  }
}

// =======================
// SCRATCH GAME
// =======================
function showScratch() {
  document.getElementById("questionCard").classList.add("hidden");
  document.getElementById("scratchCard").classList.remove("hidden");

  let canvas = document.getElementById("scratchCanvas");
  let ctx = canvas.getContext("2d");

  ctx.fillStyle = "gray";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let revealed = false;
  let prize = Math.floor(Math.random() * 6) + 1;

  function scratch(x, y) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fill();

    if (!revealed) {
      revealed = true;
      points += prize;
      document.getElementById("scratchResult").innerText = `+${prize} puntos`;
      saveState();
      updateHUD();

      setTimeout(() => {
        if (points >= 50) winPrize();
        else loadQuestion();
      }, 1500);
    }
  }

  canvas.onmousemove = (e) => {
    scratch(e.offsetX, e.offsetY);
  };

  canvas.ontouchmove = (e) => {
    let rect = canvas.getBoundingClientRect();
    let touch = e.touches[0];
    scratch(touch.clientX - rect.left, touch.clientY - rect.top);
  };
}

// =======================
// PREMIO
// =======================
function winPrize() {
  let emojis = ["🏆","🌟","🎨","🚀","👑","🎪"];
  let reward = emojis[Math.floor(Math.random() * emojis.length)];

  collection.push(reward);
  localStorage.setItem("collection", JSON.stringify(collection));

  alert("🎉 ¡PREMIO! " + reward);

  resetGame();
}

// =======================
// GAME OVER
// =======================
function showGameOver() {
  document.getElementById("questionCard").classList.add("hidden");
  document.getElementById("scratchCard").classList.add("hidden");
  document.getElementById("gameOver").classList.remove("hidden");

  document.getElementById("finalScore").innerText = `Puntos: ${points}`;
}

// =======================
// RESET
// =======================
function resetGame() {
  lives = 3;
  points = 0;
  saveState();
  updateHUD();

  document.getElementById("gameOver").classList.add("hidden");

  loadQuestion();
}

// =======================
// STORAGE
// =======================
function saveState() {
  localStorage.setItem("lives", lives);
  localStorage.setItem("points", points);
}

// =======================
// INIT
// =======================
updateHUD();
loadQuestion();

</script>

</body>
</html>
